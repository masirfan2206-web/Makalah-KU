<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Makalah KU - Masuk / Daftar</title>
    
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <meta name="theme-color" content="#2563eb">

    <!-- Tailwind CSS, Lucide Icons, & Supabase SDK -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-900 min-h-screen flex items-center justify-center p-4">

    <!-- KONFIGURASI SUPABASE -->
    <script>
        const SUPABASE_URL = "https://pyawpmegngacmpazsjvo.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_1GUfCE8wZCG-emQkMKf7Fg_pnHRVBeJ"; 
        const ADMIN_SECRET_CODE = "ipanadmin"; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden p-6 md:p-8 space-y-6">
        
        <div class="text-center space-y-2">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-white shadow-lg">
                <i data-lucide="book-open" class="w-9 h-9"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Makalah KU</h1>
            <p class="text-xs text-slate-500">Platform Pembuat Makalah Akademis Otomatis</p>
        </div>

        <!-- Tab Switch -->
        <div class="grid grid-cols-2 bg-slate-100 p-1 rounded-xl text-xs font-bold text-center">
            <button id="tabLoginBtn" onclick="switchAuthTab('login')" class="py-2.5 rounded-lg bg-white shadow text-blue-600">Masuk</button>
            <button id="tabRegisterBtn" onclick="switchAuthTab('register')" class="py-2.5 rounded-lg text-slate-500">Daftar Akun</button>
        </div>

        <!-- Alert Message -->
        <div id="authAlert" class="hidden p-3 rounded-xl text-xs font-medium border"></div>

        <!-- FORM LOGIN -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email</label>
                <input type="email" id="loginEmail" required class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                <input type="password" id="loginPassword" required class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" id="btnLoginSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition text-sm">
                Masuk ke Aplikasi
            </button>
        </form>

        <!-- FORM REGISTER -->
        <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Username</label>
                <input type="text" id="regUsername" required class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email</label>
                <input type="email" id="regEmail" required class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                <input type="password" id="regPassword" required minlength="6" class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-amber-600 uppercase mb-1 flex items-center justify-between">
                    <span>Kode Rahasia Admin</span>
                    <span class="text-[10px] text-slate-400 normal-case">(Opsional)</span>
                </label>
                <input type="password" id="regAdminKey" placeholder="Isi 'ipanadmin' untuk pendaftaran Admin" class="w-full p-3 border border-amber-300 bg-amber-50/30 rounded-xl text-sm focus:ring-2 focus:ring-amber-500">
            </div>
            <button type="submit" id="btnRegisterSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition text-sm">
                Daftar Akun Baru
            </button>
            <p class="text-[11px] text-slate-400 text-center">
                Pengguna biasa tanpa Kode Admin memerlukan verifikasi sebelum dapat masuk.
            </p>
        </form>

    </div>

    <script>
        lucide.createIcons();

        function switchAuthTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const regForm = document.getElementById('registerForm');
            const tabLoginBtn = document.getElementById('tabLoginBtn');
            const tabRegisterBtn = document.getElementById('tabRegisterBtn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                tabLoginBtn.className = "py-2.5 rounded-lg bg-white shadow text-blue-600";
                tabRegisterBtn.className = "py-2.5 rounded-lg text-slate-500";
            } else {
                regForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                tabRegisterBtn.className = "py-2.5 rounded-lg bg-white shadow text-blue-600";
                tabLoginBtn.className = "py-2.5 rounded-lg text-slate-500";
            }
        }

        function showAlert(msg, isSuccess = false) {
            const alertBox = document.getElementById('authAlert');
            alertBox.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'border-red-200', 'bg-green-50', 'text-green-600', 'border-green-200');
            alertBox.classList.add(isSuccess ? 'bg-green-50' : 'bg-red-50', isSuccess ? 'text-green-600' : 'text-red-600', isSuccess ? 'border-green-200' : 'border-red-200');
            alertBox.innerText = msg;
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const adminKey = document.getElementById('regAdminKey').value.trim();

            const btn = document.getElementById('btnRegisterSubmit');
            btn.disabled = true;
            btn.innerText = "Mendaftarkan...";

            const isAdmin = (adminKey === ADMIN_SECRET_CODE);
            const userRole = isAdmin ? 'admin' : 'user';
            const userStatus = isAdmin ? 'active' : 'pending';

            const { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: { data: { username } }
            });

            if (error) {
                btn.disabled = false;
                btn.innerText = "Daftar Akun Baru";
                showAlert(error.message);
                return;
            }

            if (data.user) {
                await supabaseClient.from('profiles').upsert({
                    id: data.user.id,
                    username,
                    email,
                    role: userRole,
                    status: userStatus
                });
            }

            btn.disabled = false;
            btn.innerText = "Daftar Akun Baru";

            if (isAdmin) {
                showAlert("Pendaftaran Admin berhasil! Silakan login.", true);
            } else {
                showAlert("Pendaftaran berhasil! Akun Anda sedang menunggu verifikasi Admin.", true);
            }
            switchAuthTab('login');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            const btn = document.getElementById('btnLoginSubmit');
            btn.disabled = true;
            btn.innerText = "Memeriksa Akun...";

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            btn.disabled = false;
            btn.innerText = "Masuk ke Aplikasi";

            if (error) {
                showAlert(error.message);
                return;
            }

            checkUserSession();
        }

        async function checkUserSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return;

            const { data: profile } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', session.user.id)
                .single();

            if (!profile) {
                showAlert("Profil akun tidak ditemukan.");
                await supabaseClient.auth.signOut();
                return;
            }

            if (profile.status === 'pending') {
                showAlert("Akun Anda belum disetujui oleh Admin. Silakan tunggu verifikasi.");
                await supabaseClient.auth.signOut();
                return;
            }

            if (profile.status === 'disabled') {
                showAlert("Akun Anda telah dinonaktifkan oleh Admin.");
                await supabaseClient.auth.signOut();
                return;
            }

            // Jika aktif, langsung arahkan ke aplikasi utama pembuat makalah
            window.location.href = '/dashboard.html';
        }

        window.onload = checkUserSession;
    </script>
</body>
</html>
