<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makalah KU - Panel Pengelolaan Admin</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <!-- KONFIGURASI SUPABASE -->
    <script>
        const SUPABASE_URL = "https://pyawpmegngacmpazsjvo.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_1GUfCE8wZCG-emQkMKf7Fg_pnHRVBeJ"; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <!-- Header Navbar -->
    <header class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i data-lucide="shield-check" class="w-7 h-7 text-amber-400"></i>
                <div>
                    <h1 class="text-base font-bold tracking-wide">Panel Pengelolaan Admin</h1>
                    <p class="text-[10px] text-slate-400" id="adminDisplayName">Memuat data admin...</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <a href="/dashboard.html" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold transition flex items-center gap-1">
                    <i data-lucide="book-open" class="w-3.5 h-3.5"></i> Ke Pembuat Makalah
                </a>
                <button onclick="handleLogout()" class="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-medium transition flex items-center gap-1">
                    <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Keluar
                </button>
            </div>
        </div>
    </header>

    <!-- Content Table -->
    <main class="max-w-6xl mx-auto p-4 md:p-6">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <div>
                    <h2 class="font-bold text-slate-800 text-base">Daftar Pengguna Aplikasi</h2>
                    <p class="text-xs text-slate-500">Kelola izin masuk dan verifikasi akun pendaftar baru.</p>
                </div>
                <button onclick="loadAdminUsers()" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-xs font-semibold flex items-center gap-1">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Muat Ulang
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-xs text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 uppercase font-bold border-b border-slate-200">
                            <th class="p-4">Username</th>
                            <th class="p-4">Email</th>
                            <th class="p-4">Role</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-right">Aksi Verifikasi</th>
                        </tr>
                    </thead>
                    <tbody id="adminUserTableList" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="5" class="p-8 text-center text-slate-400 italic">Memuat daftar pengguna...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        async function checkAdminSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = '/index.html';
                return;
            }

            const { data: profile } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', session.user.id)
                .single();

            if (!profile || profile.role !== 'admin') {
                alert("Akses ditolak! Halaman ini hanya untuk Admin.");
                window.location.href = '/dashboard.html';
                return;
            }

            document.getElementById('adminDisplayName').innerText = `Admin: ${profile.username} (${profile.email})`;
            await loadAdminUsers();
        }

        async function loadAdminUsers() {
            const { data: users, error } = await supabaseClient.from('profiles').select('*').order('created_at', { ascending: false });
            const listContainer = document.getElementById('adminUserTableList');
            listContainer.innerHTML = '';

            if (error || !users || users.length === 0) {
                listContainer.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-400 italic">Tidak ada data pengguna.</td></tr>`;
                return;
            }

            users.forEach(u => {
                const tr = document.createElement('tr');
                let badgeClass = u.status === 'active' ? 'bg-green-100 text-green-700' : (u.status === 'pending' ? 'bg-amber-100 text-amber-700' : 'bg-red-100 text-red-700');
                
                tr.innerHTML = `
                    <td class="p-4 font-bold text-slate-800">${u.username}</td>
                    <td class="p-4 text-slate-500">${u.email}</td>
                    <td class="p-4 font-semibold text-slate-600">${u.role.toUpperCase()}</td>
                    <td class="p-4"><span class="px-2.5 py-1 rounded-full font-bold text-[10px] ${badgeClass}">${u.status.toUpperCase()}</span></td>
                    <td class="p-4 text-right space-x-2">
                        ${u.status !== 'active' ? `<button onclick="updateUserStatus('${u.id}', 'active')" class="px-3 py-1.5 bg-green-600 text-white rounded-lg font-bold hover:bg-green-700 transition">Terima</button>` : ''}
                        ${u.status !== 'disabled' ? `<button onclick="updateUserStatus('${u.id}', 'disabled')" class="px-3 py-1.5 bg-red-600 text-white rounded-lg font-bold hover:bg-red-700 transition">Blokir</button>` : ''}
                    </td>
                `;
                listContainer.appendChild(tr);
            });
        }

        async function updateUserStatus(userId, status) {
            await supabaseClient.from('profiles').update({ status }).eq('id', userId);
            await loadAdminUsers();
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.href = '/index.html';
        }

        window.onload = checkAdminSession;
    </script>
</body>
</html>
